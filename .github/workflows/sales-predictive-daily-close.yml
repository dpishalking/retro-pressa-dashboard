name: Sales Predictive Daily Close

# 12:30 Europe/Moscow = 09:30 UTC. Runs after OS daily, not alongside it.
# Writes Sales OS (1Zj_j…) + Marketing ROM (1Ru9H…) via Next API.
# Heavy Bitrix foundation stays on os-daily / manual npm — in-process API
# crashes the standalone Node server (curl HTTP 000).
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sales OS
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="$(node -e 'const e=require("/opt/retro-pressa/runtime-env.json"); process.stdout.write(String(e.CRON_SYNC_SECRET||""))' 2>/dev/null || true)"
          AUTH_HEADERS=(-H "Content-Type: application/json" -H "x-forwarded-for: 127.0.0.1" -H "x-real-ip: 127.0.0.1")
          if [ -n "${SECRET:-}" ]; then
            AUTH_HEADERS+=(-H "x-cron-secret: ${SECRET}")
          fi
          MONTH="$(TZ=Europe/Riga date +%Y-%m)"
          OUT="/tmp/cron-sales-os.json"
          LOG="/tmp/cron-sales-os.log"
          rm -f "$OUT" "$LOG"
          echo "sales-os month=${MONTH}"
          nohup curl -sS --max-time 900 -o "$OUT" -w "\nHTTP %{http_code}\n" \
            -X POST http://127.0.0.1:4175/api/sync/sales-os \
            "${AUTH_HEADERS[@]}" \
            -d "{\"periods\":[\"${MONTH}\"]}" \
            >"$LOG" 2>&1 &
          PID=$!
          for i in $(seq 1 100); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 10
          done
          if kill -0 "$PID" 2>/dev/null; then
            echo "sales-os still running after timeout" >&2
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          wait "$PID" || true
          cat "$LOG" || true
          test -s "$OUT"
          python3 - <<'PY'
          import json,sys
          data=json.load(open("/tmp/cron-sales-os.json"))
          status=data.get("status") or data.get("ok")
          print("sales-os status:", status)
          if status not in ("success","ok","partial", True):
            sys.exit(1)
          PY
          EOF

      - name: Marketing Planning ROM
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="$(node -e 'const e=require("/opt/retro-pressa/runtime-env.json"); process.stdout.write(String(e.CRON_SYNC_SECRET||""))' 2>/dev/null || true)"
          AUTH_HEADERS=(-H "Content-Type: application/json" -H "x-forwarded-for: 127.0.0.1" -H "x-real-ip: 127.0.0.1")
          if [ -n "${SECRET:-}" ]; then
            AUTH_HEADERS+=(-H "x-cron-secret: ${SECRET}")
          fi
          MONTH="$(TZ=Europe/Riga date +%Y-%m)"
          OUT="/tmp/cron-marketing-planning.json"
          LOG="/tmp/cron-marketing-planning.log"
          rm -f "$OUT" "$LOG"
          echo "marketing-planning month=${MONTH}"
          # Light module set: Performance grids + facts (full "all" OOMs standalone Node).
          nohup curl -sS --max-time 600 -o "$OUT" -w "\nHTTP %{http_code}\n" \
            -X POST http://127.0.0.1:4175/api/sync/marketing-planning \
            "${AUTH_HEADERS[@]}" \
            -d "{\"periods\":[\"${MONTH}\"],\"modules\":[\"facts\",\"paid_planning\",\"marketing_planning\",\"organic_planning\"]}" \
            >"$LOG" 2>&1 &
          PID=$!
          for i in $(seq 1 70); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 10
          done
          if kill -0 "$PID" 2>/dev/null; then
            echo "marketing-planning still running after timeout" >&2
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          wait "$PID" || true
          cat "$LOG" || true
          test -s "$OUT"
          python3 - <<'PY'
          import json,sys
          data=json.load(open("/tmp/cron-marketing-planning.json"))
          status=data.get("status") or data.get("ok")
          print("marketing-planning status:", status)
          if status not in ("success","ok","partial", True):
            sys.exit(1)
          PY
          EOF

      - name: Predictive front
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="$(node -e 'const e=require("/opt/retro-pressa/runtime-env.json"); process.stdout.write(String(e.CRON_SYNC_SECRET||""))' 2>/dev/null || true)"
          AUTH_HEADERS=(-H "Content-Type: application/json" -H "x-forwarded-for: 127.0.0.1" -H "x-real-ip: 127.0.0.1")
          if [ -n "${SECRET:-}" ]; then
            AUTH_HEADERS+=(-H "x-cron-secret: ${SECRET}")
          fi
          MONTH="$(TZ=Europe/Riga date +%Y-%m)"
          echo "predictive-front month=${MONTH}"
          curl -f -sS --max-time 300 -X POST http://127.0.0.1:4175/api/sync/predictive-front \
            "${AUTH_HEADERS[@]}" \
            -d "{\"month\":\"${MONTH}\"}"
          echo
          EOF
