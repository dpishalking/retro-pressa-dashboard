name: Sales Predictive Daily Close

# 12:00 Europe/Moscow = 09:00 UTC — close previous day into:
# Sales OS (1Zj_j…) + Marketing ROM (1Ru9H…) via Next API (no tsx on standalone).
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Bitrix sales foundation
        env:
          CRON_SYNC_SECRET: ${{ secrets.CRON_SYNC_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            CRON_SYNC_SECRET="$CRON_SYNC_SECRET" AUTH_SECRET="$AUTH_SECRET" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="${CRON_SYNC_SECRET:-$AUTH_SECRET}"
          MONTH="$(TZ=Europe/Moscow date +%Y-%m)"
          echo "foundation month=${MONTH}"
          curl -f -sS --max-time 900 -X POST http://127.0.0.1:4174/api/sync/bitrix-sales-foundation \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${SECRET}" \
            -d "{\"periods\":[\"${MONTH}\"],\"modules\":[\"all\"]}"
          echo
          EOF

      - name: Sales OS
        env:
          CRON_SYNC_SECRET: ${{ secrets.CRON_SYNC_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            CRON_SYNC_SECRET="$CRON_SYNC_SECRET" AUTH_SECRET="$AUTH_SECRET" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="${CRON_SYNC_SECRET:-$AUTH_SECRET}"
          MONTH="$(TZ=Europe/Moscow date +%Y-%m)"
          echo "sales-os month=${MONTH}"
          curl -f -sS --max-time 900 -X POST http://127.0.0.1:4174/api/sync/sales-os \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${SECRET}" \
            -d "{\"periods\":[\"${MONTH}\"]}"
          echo
          EOF

      - name: Marketing Planning ROM
        env:
          CRON_SYNC_SECRET: ${{ secrets.CRON_SYNC_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            CRON_SYNC_SECRET="$CRON_SYNC_SECRET" AUTH_SECRET="$AUTH_SECRET" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="${CRON_SYNC_SECRET:-$AUTH_SECRET}"
          MONTH="$(TZ=Europe/Moscow date +%Y-%m)"
          echo "marketing-planning month=${MONTH}"
          curl -f -sS --max-time 900 -X POST http://127.0.0.1:4174/api/sync/marketing-planning \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${SECRET}" \
            -d "{\"periods\":[\"${MONTH}\"]}"
          echo
          EOF

      - name: Predictive front
        env:
          CRON_SYNC_SECRET: ${{ secrets.CRON_SYNC_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            CRON_SYNC_SECRET="$CRON_SYNC_SECRET" AUTH_SECRET="$AUTH_SECRET" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="${CRON_SYNC_SECRET:-$AUTH_SECRET}"
          MONTH="$(TZ=Europe/Moscow date +%Y-%m)"
          echo "predictive-front month=${MONTH}"
          curl -f -sS --max-time 300 -X POST http://127.0.0.1:4174/api/sync/predictive-front \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${SECRET}" \
            -d "{\"month\":\"${MONTH}\"}"
          echo
          EOF
