name: Sales Predictive Daily Close

# 12:00 Europe/Moscow = 09:00 UTC — close previous day into:
# Sales OS (1Zj_j…) + Marketing ROM (1Ru9H…) via Next API (no tsx on standalone).
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Foundation + Sales OS + Marketing Planning
        env:
          CRON_SYNC_SECRET: ${{ secrets.CRON_SYNC_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            CRON_SYNC_SECRET="$CRON_SYNC_SECRET" AUTH_SECRET="$AUTH_SECRET" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="${CRON_SYNC_SECRET:-$AUTH_SECRET}"
          if [ -z "$SECRET" ]; then
            echo "CRON_SYNC_SECRET/AUTH_SECRET is empty"
            exit 1
          fi
          MONTH="$(TZ=Europe/Moscow date +%Y-%m)"
          echo "Closing predictive month=${MONTH} Europe/Moscow via API"

          echo "== bitrix-sales-foundation =="
          curl -f -sS -X POST http://127.0.0.1:4174/api/sync/bitrix-sales-foundation \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${SECRET}" \
            -d "{\"periods\":[\"${MONTH}\"],\"modules\":[\"all\"]}"

          echo
          echo "== sales-os =="
          curl -f -sS -X POST http://127.0.0.1:4174/api/sync/sales-os \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${SECRET}" \
            -d "{\"periods\":[\"${MONTH}\"]}"

          echo
          echo "== marketing-planning =="
          curl -f -sS -X POST http://127.0.0.1:4174/api/sync/marketing-planning \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${SECRET}" \
            -d "{\"periods\":[\"${MONTH}\"]}"

          echo
          echo "== predictive-front =="
          curl -f -sS -X POST http://127.0.0.1:4174/api/sync/predictive-front \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${SECRET}" \
            -d "{\"month\":\"${MONTH}\"}"
          EOF
