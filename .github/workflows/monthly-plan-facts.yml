name: Finance Plan Fact Morning

# 09:00 Europe/Riga = 06:00 UTC (summer). Once a day — Fact only, never Plan.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Write RP | Finance «План/факт» Fact column
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="$(node -e 'const e=require("/opt/retro-pressa/runtime-env.json"); process.stdout.write(String(e.CRON_SYNC_SECRET||""))' 2>/dev/null || true)"
          AUTH_HEADERS=(-H "Content-Type: application/json" -H "x-forwarded-for: 127.0.0.1" -H "x-real-ip: 127.0.0.1")
          if [ -n "${SECRET:-}" ]; then
            AUTH_HEADERS+=(-H "x-cron-secret: ${SECRET}")
          else
            echo "CRON_SYNC_SECRET missing in runtime-env.json"
            exit 1
          fi
          MONTH="$(TZ=Europe/Riga date +%Y-%m)"
          echo "monthly-plan-facts month=${MONTH}"
          curl -f -sS --max-time 180 -X POST http://127.0.0.1:4175/api/sync/monthly-plan-facts \
            "${AUTH_HEADERS[@]}" \
            -d "{\"month\":\"${MONTH}\"}"
          echo
          EOF
