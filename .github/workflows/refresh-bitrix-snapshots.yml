name: Refresh Bitrix snapshots

# Invalidate Analytics OS Bitrix period snapshots on Timeweb so the next BI request
# rebuilds cash from SPA invoices (type/31 Оплачено + Дата завершения).
on:
  workflow_dispatch:
    inputs:
      periods:
        description: "Comma-separated PeriodKey list"
        required: false
        default: "july-2026,august-2026"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Invalidate Bitrix snapshots on server
        env:
          PERIODS: ${{ inputs.periods }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            PERIODS="$PERIODS" \
            bash -s << 'EOF'
          set -euo pipefail
          DATA="/opt/retro-pressa-shared/data"
          SNAP="$DATA/bitrix-snapshots"
          CACHE="$DATA/sales-cycle-cache"
          mkdir -p "$SNAP" "$CACHE"
          IFS=',' read -r -a LIST <<< "${PERIODS:-august-2026}"
          for PERIOD in "${LIST[@]}"; do
            PERIOD="$(echo "$PERIOD" | xargs)"
            [ -n "$PERIOD" ] || continue
            if [ -f "$SNAP/${PERIOD}.json" ]; then
              rm -f "$SNAP/${PERIOD}.json"
              echo "removed $SNAP/${PERIOD}.json"
            else
              echo "no snapshot for ${PERIOD}"
            fi
          done
          rm -f "$CACHE"/* 2>/dev/null || true
          echo "cleared sales-cycle cache"
          curl -sS --max-time 20 http://127.0.0.1:4175/api/health || true
          echo
          ls -la "$SNAP" | head -20
          EOF
