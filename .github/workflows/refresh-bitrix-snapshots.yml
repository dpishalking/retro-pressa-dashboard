name: Refresh Bitrix snapshots

# Rebuild Analytics OS Bitrix period snapshots on Timeweb (cash = SPA invoices).
on:
  workflow_dispatch:
    inputs:
      periods:
        description: "Comma-separated PeriodKey list"
        required: false
        default: "july-2026,august-2026"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Refresh Bitrix snapshots on server
        env:
          PERIODS: ${{ inputs.periods }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            PERIODS="$PERIODS" \
            bash -s << 'EOF'
          set -euo pipefail
          APP_DIR="/opt/retro-pressa"
          SECRET="$(node -e 'const e=require("/opt/retro-pressa/runtime-env.json"); process.stdout.write(String(e.CRON_SYNC_SECRET||""))')"
          if [ -z "$SECRET" ]; then
            echo "CRON_SYNC_SECRET missing in /opt/retro-pressa/runtime-env.json"
            exit 1
          fi
          IFS=',' read -r -a LIST <<< "${PERIODS:-august-2026}"
          for PERIOD in "${LIST[@]}"; do
            PERIOD="$(echo "$PERIOD" | xargs)"
            [ -n "$PERIOD" ] || continue
            echo "sync bitrix period=${PERIOD}"
            curl -f -sS --max-time 300 -X POST http://127.0.0.1:4175/api/sync/bitrix \
              -H "Content-Type: application/json" \
              -H "x-cron-secret: ${SECRET}" \
              -d "{\"period\":\"${PERIOD}\",\"refresh\":true}"
            echo
            sleep 8
          done
          EOF
