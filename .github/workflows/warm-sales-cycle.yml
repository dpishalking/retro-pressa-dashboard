name: Warm sales-cycle cache

# Rebuild data/sales-cycle-cache on Timeweb so /os/cohorts and /os/sales-cycle load instantly.
on:
  workflow_dispatch:
    inputs:
      periods:
        description: "Optional ISO periods JSON array, e.g. [\"2026-07\",\"2026-08\"]"
        required: false
        default: ""
      grains:
        description: "Comma-separated grains"
        required: false
        default: "month,week"

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              exit 0
            fi
            echo "ssh-keyscan attempt $i failed; retrying..."
            sleep 3
          done
          # Last resort: accept host key on first connect
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'echo ssh-ok'

      - name: Warm cohorts on worker
        env:
          PERIODS_JSON: ${{ inputs.periods }}
          GRAINS: ${{ inputs.grains }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            PERIODS_JSON="$PERIODS_JSON" \
            GRAINS="$GRAINS" \
            bash -s << 'EOF'
          set -euo pipefail
          export GRAINS="${GRAINS:-month,week}"
          export PERIODS_JSON="${PERIODS_JSON:-}"
          BODY="$(node <<'NODE'
const grains = String(process.env.GRAINS || "month,week")
  .split(",")
  .map((s) => s.trim())
  .filter(Boolean);
const rawPeriods = String(process.env.PERIODS_JSON || "").trim();
const body = { grains };
if (rawPeriods) body.periods = JSON.parse(rawPeriods);
process.stdout.write(JSON.stringify(body));
NODE
)"
          echo "POST /api/sync/sales-cycle body=$BODY"
          # Prefer loopback auth — CRON_SYNC_SECRET may be empty in runtime-env.json.
          curl -f -sS --max-time 600 -X POST http://127.0.0.1:4175/api/sync/sales-cycle \
            -H "Content-Type: application/json" \
            -H "x-forwarded-for: 127.0.0.1" \
            -H "x-real-ip: 127.0.0.1" \
            -d "$BODY"
          echo
          ls -lah /opt/retro-pressa-shared/data/sales-cycle-cache | head -40
          EOF
