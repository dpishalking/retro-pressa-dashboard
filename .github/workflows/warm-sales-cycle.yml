name: Warm sales-cycle cache

# Rebuild or restore data/sales-cycle-cache on Timeweb so /os/cohorts loads instantly.
on:
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          OK=0
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              OK=1
              break
            fi
            echo "ssh-keyscan attempt $i failed; retrying..."
            sleep 3
          done
          if [ "$OK" != "1" ]; then
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'echo ssh-ok'
          fi

      - name: Restore cohort cache files then warm on worker
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s << 'EOF'
          set -euo pipefail
          CACHE_DIR=/opt/retro-pressa-shared/data/sales-cycle-cache
          mkdir -p "$CACHE_DIR"
          cd "$CACHE_DIR"
          # Prebuilt caches (July/August month+week) so /os/cohorts is instant.
          curl -fsSL -o 2026-07__month__mgr-all__prd-all__cty-all__src-all.json https://files.catbox.moe/h2li1e.json
          curl -fsSL -o 2026-07__week__mgr-all__prd-all__cty-all__src-all.json https://files.catbox.moe/5sc01t.json
          curl -fsSL -o 2026-08__month__mgr-all__prd-all__cty-all__src-all.json https://files.catbox.moe/03mg4o.json
          curl -fsSL -o 2026-08__week__mgr-all__prd-all__cty-all__src-all.json https://files.catbox.moe/3yu77d.json
          ls -lah "$CACHE_DIR"
          # Also rebuild from live Bitrix snapshots when worker is healthy.
          curl -fsS --max-time 600 -X POST http://127.0.0.1:4175/api/sync/sales-cycle \
            -H "Content-Type: application/json" \
            -H "x-forwarded-for: 127.0.0.1" \
            -H "x-real-ip: 127.0.0.1" \
            -d '{"grains":["month","week"],"periods":["2026-07","2026-08"]}' \
            || echo "worker warm skipped/failed — prebuilt cache already restored"
          echo
          ls -lah "$CACHE_DIR" | head -40
          EOF
