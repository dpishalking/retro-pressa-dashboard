name: OS Daily Sheets Sync

# 10:00 Europe/Moscow = 07:00 UTC. Kept separate from predictive close.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Refresh OS Orders + Traffic for yesterday (Moscow)
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="$(node -e 'const e=require("/opt/retro-pressa/runtime-env.json"); process.stdout.write(String(e.CRON_SYNC_SECRET||""))')"
          if [ -z "$SECRET" ]; then
            echo "CRON_SYNC_SECRET missing in /opt/retro-pressa/runtime-env.json"
            exit 1
          fi
          curl -f -sS --max-time 300 -X POST http://127.0.0.1:4175/api/sync/os-daily \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${SECRET}" \
            -d '{"refresh":true}'
          echo
          curl -f -sS --max-time 600 -X POST http://127.0.0.1:4175/api/sync/sales-cycle \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${SECRET}" \
            -d '{"grains":["month","week"]}'
          echo
          ls -lah /opt/retro-pressa-shared/data/sales-cycle-cache | head -20
          EOF
