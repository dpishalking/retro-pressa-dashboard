name: Reset Admin Password

# One-shot ops: set admin password from secret ADMIN_PASSWORD_RESET.
on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for i in 1 2 3 4 5; do
            if ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "ssh-keyscan failed" >&2
          exit 1

      - name: Update admin password on server
        env:
          NEW_PASSWORD: ${{ secrets.ADMIN_PASSWORD_RESET }}
        run: |
          if [ -z "$NEW_PASSWORD" ]; then
            echo "Set GitHub secret ADMIN_PASSWORD_RESET first" >&2
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            NEW_PASSWORD="$NEW_PASSWORD" \
            bash -s << 'EOF'
          set -euo pipefail
          export NEW_PASSWORD
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const password = process.env.NEW_PASSWORD;
          if (!password || password.length < 6) {
            console.error("NEW_PASSWORD missing or too short");
            process.exit(1);
          }
          const salt = crypto.randomBytes(16).toString("hex");
          const hash = crypto.scryptSync(password, salt, 64).toString("hex");
          const passwordHash = `${salt}:${hash}`;
          const now = new Date().toISOString();

          const paths = [
            "/opt/retro-pressa-shared/data/auth/users.json",
            "/opt/retro-pressa-shared/auth-catalog/users.json",
            "/opt/retro-pressa-shared/data/auth/users.json.bak"
          ];

          function load(p) {
            try {
              return JSON.parse(fs.readFileSync(p, "utf8"));
            } catch {
              return null;
            }
          }

          const primary = paths[0];
          let catalog = load(primary) || load(paths[1]);
          if (!catalog || !Array.isArray(catalog.users) || !catalog.users.length) {
            catalog = { version: 1, users: [], updatedAt: now };
          }

          let admin = catalog.users.find((u) => String(u.login || "").toLowerCase() === "admin");
          if (!admin) {
            admin = {
              id: "admin-default",
              login: "admin",
              name: "Администратор",
              accessLevel: "admin",
              active: true,
              createdAt: now
            };
            catalog.users.unshift(admin);
          }
          admin.passwordHash = passwordHash;
          admin.active = true;
          admin.accessLevel = "admin";
          admin.updatedAt = now;
          catalog.updatedAt = now;

          const body = `${JSON.stringify(catalog, null, 2)}\n`;
          for (const p of paths) {
            fs.mkdirSync(path.dirname(p), { recursive: true });
            fs.writeFileSync(p, body, "utf8");
          }
          console.log(JSON.stringify({
            ok: true,
            users: catalog.users.length,
            adminLogin: admin.login,
            updatedAt: now
          }));
          NODE
          EOF
