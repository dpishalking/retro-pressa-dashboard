name: Clear analytics caches
on:
  workflow_dispatch:
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Clear company snapshots
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          rm -f /opt/retro-pressa-shared/data/company-snapshots/*.json || true
          rm -f /opt/retro-pressa-shared/data/sales-cycle-cache/* || true
          ls -la /opt/retro-pressa-shared/data/bitrix-snapshots
          ls -la /opt/retro-pressa-shared/data/company-snapshots || true
          SECRET="$(node -e 'const e=require("/opt/retro-pressa/runtime-env.json"); process.stdout.write(String(e.CRON_SYNC_SECRET||""))' 2>/dev/null || true)"
          AUTH_HEADERS=(-H "Content-Type: application/json" -H "x-forwarded-for: 127.0.0.1" -H "x-real-ip: 127.0.0.1")
          if [ -n "${SECRET:-}" ]; then
            AUTH_HEADERS+=(-H "x-cron-secret: ${SECRET}")
          fi
          if [ -n "${SECRET:-}" ] || true; then
            curl -f -sS --max-time 600 -X POST http://127.0.0.1:4175/api/sync/sales-cycle \
              "${AUTH_HEADERS[@]}" \
              -d '{"grains":["month","week"]}' || true
            echo
            ls -lah /opt/retro-pressa-shared/data/sales-cycle-cache | head -20
          fi
          EOF
