name: Shift Board Hourly Sync

# Every hour (UTC :10) — refresh manager shift board on Google Sheets.
# Runs on GitHub Actions → SSH → Timeweb worker. No laptop required.
# Also installs/keeps a VPS crontab as a backup (same endpoint).
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure VPS hourly crontab
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s << 'EOF'
          set -euo pipefail
          mkdir -p /opt/retro-pressa-shared/bin /opt/retro-pressa-shared/logs
          cat > /opt/retro-pressa-shared/bin/shift-board-sync.sh << 'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          SECRET="$(node -e 'const e=require("/opt/retro-pressa/runtime-env.json"); process.stdout.write(String(e.CRON_SYNC_SECRET||""))' 2>/dev/null || true)"
          AUTH_HEADERS=(-H "Content-Type: application/json" -H "x-forwarded-for: 127.0.0.1" -H "x-real-ip: 127.0.0.1")
          if [ -n "${SECRET:-}" ]; then
            AUTH_HEADERS+=(-H "x-cron-secret: ${SECRET}")
          fi
          curl -fsS --max-time 300 -X POST http://127.0.0.1:4175/api/sync/shift-board \
            "${AUTH_HEADERS[@]}" \
            -d '{}' >> /opt/retro-pressa-shared/logs/shift-board-sync.log 2>&1
          echo >> /opt/retro-pressa-shared/logs/shift-board-sync.log
          SCRIPT
          chmod +x /opt/retro-pressa-shared/bin/shift-board-sync.sh
          # UTC :15 — offset from GitHub :10 so one still hits if the other lags.
          tmp="$(mktemp)"
          crontab -l 2>/dev/null | grep -v 'shift-board-sync.sh' > "$tmp" || true
          echo '15 * * * * /opt/retro-pressa-shared/bin/shift-board-sync.sh' >> "$tmp"
          crontab "$tmp"
          rm -f "$tmp"
          echo "user crontab installed"
          crontab -l | grep shift-board || true
          EOF

      - name: Refresh shift board
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="$(node -e 'const e=require("/opt/retro-pressa/runtime-env.json"); process.stdout.write(String(e.CRON_SYNC_SECRET||""))' 2>/dev/null || true)"
          AUTH_HEADERS=(-H "Content-Type: application/json" -H "x-forwarded-for: 127.0.0.1" -H "x-real-ip: 127.0.0.1")
          if [ -n "${SECRET:-}" ]; then
            AUTH_HEADERS+=(-H "x-cron-secret: ${SECRET}")
          fi
          echo "shift-board sync"
          curl -f -sS --max-time 300 -X POST http://127.0.0.1:4175/api/sync/shift-board \
            "${AUTH_HEADERS[@]}" \
            -d '{}'
          echo
          EOF
