name: Daily ROP Sync

on:
  schedule:
    # ~09:15 Europe/Riga (06:15 UTC) — after morning Bitrix activity settles
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # Sheet «Сводка дня» must update even when the heavy ROP daily-sync fails.
      - name: Sync ROP alerts sheet (Сводка дня)
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="$(node -e 'const e=require("/opt/retro-pressa/runtime-env.json"); process.stdout.write(String(e.CRON_SYNC_SECRET||""))' 2>/dev/null || true)"
          AUTH_HEADERS=(-H "Content-Type: application/json" -H "x-forwarded-for: 127.0.0.1" -H "x-real-ip: 127.0.0.1")
          if [ -n "${SECRET:-}" ]; then
            AUTH_HEADERS+=(-H "x-cron-secret: ${SECRET}")
          fi
          echo "rop alerts (Сводка дня)"
          OUT="$(mktemp)"
          CODE="$(curl -sS --max-time 300 -o "$OUT" -w "%{http_code}" -X POST http://127.0.0.1:4175/api/sync/rop-alerts \
            "${AUTH_HEADERS[@]}" \
            -d '{"includeDialogs":true}' || true)"
          echo "HTTP ${CODE}"
          head -c 4000 "$OUT" || true
          echo
          if [ "$CODE" != "200" ]; then
            echo "rop-alerts failed with HTTP ${CODE}" >&2
            exit 1
          fi
          EOF

      # Soft-fail: Bitrix often returns "Too many requests" right after the alerts pull.
      - name: Run ROP daily-sync (conversations / metrics)
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="$(node -e 'const e=require("/opt/retro-pressa/runtime-env.json"); process.stdout.write(String(e.CRON_SYNC_SECRET||""))' 2>/dev/null || true)"
          AUTH_HEADERS=(-H "Content-Type: application/json" -H "x-forwarded-for: 127.0.0.1" -H "x-real-ip: 127.0.0.1")
          if [ -n "${SECRET:-}" ]; then
            AUTH_HEADERS+=(-H "x-cron-secret: ${SECRET}")
          fi
          echo "cooldown 90s after alerts Bitrix pull"
          sleep 90
          echo "rop daily-sync"
          OUT="$(mktemp)"
          CODE="$(curl -sS --max-time 300 -o "$OUT" -w "%{http_code}" -X POST http://127.0.0.1:4175/api/rop/daily-sync \
            "${AUTH_HEADERS[@]}" \
            -d '{"refresh":true,"daysBack":3,"dialogLimit":250,"incremental":true,"exportToSheet":true,"manager":"*","sheetMode":"incremental"}' || true)"
          echo "HTTP ${CODE}"
          head -c 4000 "$OUT" || true
          echo
          if [ "$CODE" != "200" ]; then
            echo "rop daily-sync failed with HTTP ${CODE}" >&2
            exit 1
          fi
          EOF
