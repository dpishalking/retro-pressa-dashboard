name: Daily ROP Sync

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Run daily sync on server
        env:
          CRON_SYNC_SECRET: ${{ secrets.CRON_SYNC_SECRET }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            CRON_SYNC_SECRET="$CRON_SYNC_SECRET" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="${CRON_SYNC_SECRET:-}"
          if [ -z "$SECRET" ]; then
            echo "CRON_SYNC_SECRET is empty"
            exit 1
          fi
          curl -f -sS -X POST http://127.0.0.1:4175/api/rop/daily-sync \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${SECRET}" \
            -d '{"refresh":true,"daysBack":3,"dialogLimit":250,"incremental":true,"exportToSheet":true,"manager":"*","sheetMode":"incremental"}'
          EOF
