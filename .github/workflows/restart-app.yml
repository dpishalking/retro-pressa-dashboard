name: Restart App

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Prefer keyscan, but don't block restart if host key fetch flakes.
          ssh-keyscan -T 8 -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          if ! grep -q "${{ secrets.DEPLOY_HOST }}" ~/.ssh/known_hosts 2>/dev/null; then
            echo "keyscan missed — will use accept-new"
          fi

      - name: Diagnose and restart
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=30 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s << 'EOF'
          set -euo pipefail
          echo "== host =="
          hostname; uptime; date -u
          echo "== load/mem =="
          cat /proc/loadavg || true
          free -m | head -2 || true
          df -h / | tail -1
          echo "== pm2 before =="
          pm2 list || true
          echo "== kill hung node ports if any =="
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 4174/tcp || true
            fuser -k 4175/tcp || true
          fi
          echo "== restart RPBI web + worker =="
          cd /opt/retro-pressa
          pm2 delete retro-pressa 2>/dev/null || true
          pm2 delete retro-pressa-worker 2>/dev/null || true
          if [ -f ecosystem.config.cjs ]; then
            pm2 start ecosystem.config.cjs
          else
            echo "missing ecosystem.config.cjs" >&2
            ls -la
            exit 1
          fi
          pm2 save || true
          sleep 5
          pm2 list
          echo "== local health =="
          for i in 1 2 3 4 5 6; do
            WEB_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 8 http://127.0.0.1:4174/api/health || echo fail)
            WORKER_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 8 http://127.0.0.1:4175/api/health || echo fail)
            echo "try $i => web=$WEB_CODE worker=$WORKER_CODE"
            if [ "$WEB_CODE" = "200" ] && [ "$WORKER_CODE" = "200" ]; then
              break
            fi
            sleep 3
          done
          EOF
