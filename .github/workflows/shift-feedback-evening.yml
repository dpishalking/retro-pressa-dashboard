name: Shift Feedback Evening Cut

# 20:05 Europe/Moscow = 17:05 UTC (Moscow has no DST).
on:
  schedule:
    - cron: "5 17 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Build evening shift cut
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s << 'EOF'
          set -euo pipefail
          SECRET="$(node -e 'const e=require("/opt/retro-pressa/runtime-env.json"); process.stdout.write(String(e.CRON_SYNC_SECRET||""))' 2>/dev/null || true)"
          AUTH_HEADERS=(-H "Content-Type: application/json" -H "x-forwarded-for: 127.0.0.1" -H "x-real-ip: 127.0.0.1")
          if [ -n "${SECRET:-}" ]; then
            AUTH_HEADERS+=(-H "x-cron-secret: ${SECRET}")
          fi
          echo "shift-feedback evening cut"
          OUT="$(mktemp)"
          CODE="$(curl -sS --max-time 420 -o "$OUT" -w "%{http_code}" -X POST http://127.0.0.1:4175/api/sync/shift-feedback \
            "${AUTH_HEADERS[@]}" \
            -d '{}' || true)"
          echo "HTTP ${CODE}"
          head -c 4000 "$OUT" || true
          echo
          if [ "$CODE" != "200" ]; then
            echo "shift-feedback failed with HTTP ${CODE}" >&2
            exit 1
          fi
          EOF
